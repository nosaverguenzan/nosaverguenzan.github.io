name: Monitor Diario BOE
on:
  schedule:
    - cron: "15 7 * * 1-6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  boe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/
      - env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m engine.run_boe_daily
      - run: |
          git config user.name "Sinstitucion-Bot"
          git config user.email "bot@sinstitucion.local"
          git add constitucion/
          git commit -m "Actualizacion doctrinal BOE" || true
          git push
