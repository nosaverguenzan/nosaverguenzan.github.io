name: Generar Articulos Constitucion (Lotes)

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Articulo inicial (1-169)"
        required: true
        default: "1"
      hasta:
        description: "Articulo final (1-169)"
        required: true
        default: "5"

permissions:
  contents: write

jobs:
  generar-lote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
