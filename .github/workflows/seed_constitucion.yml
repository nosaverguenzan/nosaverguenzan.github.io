name: Generar Articulos Constitucion
on:
  workflow_dispatch:
    inputs:
      desde:
        description: Articulo inicial
        required: true
        default: "1"
      hasta:
        description: Articulo final
        required: true
        default: "5"
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -c "from engine.connectors.constitucion import generar_lote; generar_lote(int('${{ github.event.inputs.desde }}'), int('${{ github.event.inputs.hasta }}'))"
      - run: pytest tests/
      - run: |
          git config user.name "Sinstitucion-Bot"
          git config user.email "bot@sinstitucion.local"
          git add constitucion/
          git commit -m "Genera lote articulos CE" || true
          git push
